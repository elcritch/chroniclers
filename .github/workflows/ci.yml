name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install latest Atlas and set up Nim
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | \
            ATLAS_INSTALL_DIR="$HOME/.local/bin" bash -
          "$HOME/.local/bin/atlas" env 2.2.10 --binary --github-path

      - name: Cache atlas deps
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ runner.os }}-atlas-${{ hashFiles('chroniclers.nimble') }}
          restore-keys: |
            ${{ runner.os }}-atlas-

      - run: atlas -v
      - run: atlas init
      - run: atlas install --feature:chronicles
      - run: nim test
